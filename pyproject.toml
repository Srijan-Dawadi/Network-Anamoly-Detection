[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "network-anomaly-autoencoder"
version = "0.1.0"
description = "Deep Autoencoder pipeline for network anomaly detection (NSL-KDD)."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "tensorflow>=2.15",
    "scikit-learn>=1.4",
    "pandas>=2.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.0",
    "pytest-cov>=4.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["network_anomaly_autoencoder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["network_anomaly_autoencoder"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 90
